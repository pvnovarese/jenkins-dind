volumes:
  jenkins-data-volume:
    external: false
  jenkins-docker-certs-volume:
    external: false

networks:
  jenkins:
    driver: bridge

services:
  dind:
    image: docker:dind
    privileged: true
    # uncomment this if you're using user namespace remapping (you're probably not)
    # userns_mode: host
    ports:
      - "2376:2376"
    networks:
      jenkins:
        aliases:
          - docker
    volumes: 
      - jenkins-data-volume:/var/jenkins_home
      - jenkins-docker-certs-volume:/certs/client
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker", "version"]
    restart: unless-stopped

  jenkins:
    #image: 'pvnovarese/jenkins:latest'
    build:
      context: ./jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    networks:
      - jenkins
    volumes:
      - jenkins-data-volume:/var/jenkins_home
      - jenkins-docker-certs-volume:/certs/client
    environment:
      - DOCKER_HOST=tcp://docker:2376 
      - DOCKER_CERT_PATH=/certs/client 
      - DOCKER_TLS_VERIFY=1 
    restart: unless-stopped

