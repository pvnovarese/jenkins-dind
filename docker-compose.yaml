version: '3'

volumes:
  jenkins-data-volume:
    external: false
  jenkins-docker-certs-volume:
    external: false

# use this network section for standalone deployment, 
# but remember to change the network section of each service
networks:
  jenkins:
    driver: bridge

# join the network that the anchore-enterprise deployment is using
#networks:
#  enterprise_default:
#    external: true

services:
  dind:
    image: docker:dind
    privileged: true
    # uncomment this if you're using user namespace remapping (you're probably not)
    # userns_mode: host
    ports:
      - "2376:2376"
    networks:
      jenkins:
        aliases:
          - docker
    volumes: 
      - jenkins-data-volume:/var/jenkins_home
      - jenkins-docker-certs-volume:/certs/client
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker", "version"]
    restart: unless-stopped

  jenkins:
    #image: 'pvnovarese/jenkins:latest'
    build:
      context: ./jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    networks:
      - jenkins
    volumes:
      - jenkins-data-volume:/var/jenkins_home
      - jenkins-docker-certs-volume:/certs/client
    environment:
      - DOCKER_HOST=tcp://docker:2376 
      - DOCKER_CERT_PATH=/certs/client 
      - DOCKER_TLS_VERIFY=1 
    depends_on:
      dind:
        condition: service_healthy
    restart: unless-stopped

